<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CMS - SyncedOffice</title>
	
	<!-- Dynamically loaded CSS from Vite manifest -->
	{% for css_file in cms_css %}
	<link rel="stylesheet" href="{{ css_file }}">
	{% endfor %}
	
	<style>
		.loading {
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			font-size: 18px;
			color: #666;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
		}
	</style>
</head>
<body>
	<div id="app">
		<div class="loading">Loading CMS...</div>
	</div>
	
	<!-- Dynamically loaded JS from Vite manifest -->
	<script type="module" src="{{ cms_js }}?v={{ frappe.utils.cint(frappe.utils.now_datetime().timestamp()) }}"></script>
</body>
</html>
