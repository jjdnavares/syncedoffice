<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- n8n-inspired node workflow design with sync twist -->
  
  <!-- Define gradient for modern look -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Connection lines forming a sync pattern (figure-8 / infinity) -->
  <path d="M 50 80 Q 70 60, 100 80" stroke="url(#grad1)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 100 80 Q 130 100, 150 80" stroke="url(#grad1)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 50 120 Q 70 140, 100 120" stroke="url(#grad1)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 100 120 Q 130 100, 150 120" stroke="url(#grad1)" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Left node (input/source) -->
  <circle cx="50" cy="80" r="18" fill="white" stroke="url(#grad1)" stroke-width="6"/>
  <circle cx="50" cy="80" r="8" fill="url(#grad1)"/>
  
  <!-- Center node (sync/processing) - larger to emphasize -->
  <circle cx="100" cy="100" r="22" fill="white" stroke="url(#grad1)" stroke-width="6"/>
  <circle cx="100" cy="100" r="10" fill="url(#grad1)"/>
  
  <!-- Right node (output/destination) -->
  <circle cx="150" cy="80" r="18" fill="white" stroke="url(#grad1)" stroke-width="6"/>
  <circle cx="150" cy="80" r="8" fill="url(#grad1)"/>
  
  <!-- Bottom left node -->
  <circle cx="50" cy="120" r="18" fill="white" stroke="url(#grad1)" stroke-width="6"/>
  <circle cx="50" cy="120" r="8" fill="url(#grad1)"/>
  
  <!-- Bottom right node -->
  <circle cx="150" cy="120" r="18" fill="white" stroke="url(#grad1)" stroke-width="6"/>
  <circle cx="150" cy="120" r="8" fill="url(#grad1)"/>
  
  <!-- Sync arrows in center node to show bidirectional flow -->
  <g transform="translate(100, 100)">
    <path d="M -6 -3 L -2 -7 L -2 -3 L 2 -3 L 2 -7 L 6 -3 L 2 1 L 2 -3" fill="white" opacity="0.9"/>
    <path d="M -6 3 L -2 7 L -2 3 L 2 3 L 2 7 L 6 3 L 2 -1 L 2 3" fill="white" opacity="0.9" transform="rotate(180)"/>
  </g>
</svg>
